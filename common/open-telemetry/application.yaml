# OpenTelemetry declarative configuration, consumed by otel agent auto-instrumentation.
file_format: "1.1"

otpl:
    host: http://otel-collector-opentelemetry-collector.monitoring.svc

resource:
  attributes:
    - name: service.name
      value: ${SERVICE_NAME}
    - name: deployment.namespace
      value: ${POD_NAMESPACE}

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${otpl.host}:4317
  sampler:
    always_on: null

meter_provider:
  readers:
    - periodic:
        interval: 15000
        exporter:
          otlp_grpc:
            endpoint: ${otpl.host}:4317

logger_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${otpl.host}:4317